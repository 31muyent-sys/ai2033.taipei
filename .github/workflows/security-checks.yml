name: Security regression checks
on:
  pull_request:
  workflow_dispatch:
  push:
    paths: ['tools/security/**', 'tools/leaderboard/**', 'og/**', 'package*.json', 'video/package*.json', '.github/workflows/security-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            og/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix og --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix og --audit-level=moderate
      - run: npm audit --prefix video --package-lock-only --audit-level=moderate
      - run: npm run credits && git diff --exit-code -- DEPENDENCIES.md
