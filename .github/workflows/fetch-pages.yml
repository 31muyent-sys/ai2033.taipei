name: fetch-pages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: fetch-pages, cancel-in-progress: false }
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install requests trafilatura
      - run: python tools/fetch/pages.py
      - run: 'bash tools/fetch/commit.sh "chore(research): archive source pages" research/pages'
