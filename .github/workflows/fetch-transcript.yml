name: fetch-transcript
on:
  workflow_dispatch:
    inputs:
      media_url:
        description: '可直接下載的影片/音檔網址（選填）'
        required: false
permissions:
  contents: write
concurrency: { group: fetch-transcript, cancel-in-progress: false }
jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install faster-whisper opencc-python-reimplemented==0.1.7
      - run: bash tools/fetch/youtube.sh ircGbXWHRbQ
        env:
          MEDIA_URL: ${{ github.event.inputs.media_url }}
      - run: 'bash tools/fetch/commit.sh "chore(transcript): video metadata and captions" research/youtube'
      - name: Transcribe
        run: |
          if [ -f /tmp/yt/audio16k.wav ]; then python tools/fetch/transcribe.py /tmp/yt/audio16k.wav && python tools/build/build_transcript.py; fi
      - if: always()
        run: 'bash tools/fetch/commit.sh "chore(transcript): whisper transcript of 2026-10-08 press conference" research/youtube transcript'
