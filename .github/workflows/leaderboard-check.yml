name: leaderboard check

# Checks the public 2033 外送王 boards on Supabase from outside: the functions exist, answer with the expected
# shape, and refuse bad runs. Uses only calls that are rejected before anything is written. Then checks the share
# pages (og/ on Vercel, SHARE in board.js): each answers with its own preview tags and a PNG card.
on:
  workflow_dispatch:
  push:
    paths:
      - 3d/js/board.js
      - tools/leaderboard/**
      - og/**
      - .github/workflows/leaderboard-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Call race_boards and submit_score
        run: |
          set -u
          URL=$(sed -n "s/^ *url: '\(https:[^']*\)'.*/\1/p" 3d/js/board.js)
          KEY=$(sed -n "s/^ *key: '\([^']*\)'.*/\1/p" 3d/js/board.js)
          echo "project: $URL"
          call() { curl -sS -o /tmp/out.json -w '%{http_code}' -X POST -H "apikey: $KEY" -H 'Content-Type: application/json' -d "$2" "$URL/rest/v1/rpc/$1"; }
          fail=0
          code=$(call race_boards '{"p_course":"c2","p_limit":10}'); echo "race_boards -> HTTP $code"; cat /tmp/out.json; echo
          if [ "$code" != 200 ] || ! jq -e '(.rev >= 3) and (.total | type == "array") and (.legs | length == 5)' /tmp/out.json >/dev/null; then
            echo "::error::race_boards is missing, outdated or answers the wrong shape — run the current tools/leaderboard/supabase.sql in the SQL editor"; fail=1
          else
            jq -r '"total board: \(.total | length) entries; order boards: \([.legs[] | length] | join(", "))"' /tmp/out.json
          fi
          code=$(call submit_score '{"p_course":"c2","p_initials":"ab","p_legs":[1],"p_splits":[20000],"p_trace":[]}'); echo "bad initials -> HTTP $code $(cat /tmp/out.json)"
          jq -e '.message == "bad_initials"' /tmp/out.json >/dev/null || { echo "::error::submit_score did not refuse bad initials"; fail=1; }
          code=$(call submit_score '{"p_course":"c2","p_initials":"QQQ","p_legs":[1],"p_splits":[20000],"p_trace":[[0,101,691],[20000,1001,551]]}'); echo "teleporting run -> HTTP $code $(cat /tmp/out.json)"
          jq -e '.message == "implausible" or .message == "rate_limited"' /tmp/out.json >/dev/null || { echo "::error::submit_score did not refuse an impossible run"; fail=1; }
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -H "apikey: $KEY" "$URL/rest/v1/race_scores?select=*&limit=1"); echo "direct table read -> HTTP $code $(cat /tmp/out.json)"
          if [ "$code" = 200 ] && [ "$(jq 'length' /tmp/out.json)" != 0 ]; then echo "::error::race_scores is readable directly"; fail=1; fi
          exit $fail
      - name: Share pages and cards
        run: |
          set -u
          SHARE=$(sed -n "s/^export const SHARE = '\([^']*\)'.*/\1/p" 3d/js/board.js)
          if [ -z "$SHARE" ]; then echo "SHARE is not set in board.js: nothing to check"; exit 0; fi
          # a push to og/ also redeploys the service on Vercel; give that a head start
          if [ "${{ github.event_name }}" = push ]; then sleep 90; fi
          fail=0
          check() {   # $1 path, $2 text the preview title must contain
            code=$(curl -sS -L -A 'facebookexternalhit/1.1' -o /tmp/page.html -w '%{http_code}' "$SHARE$1")
            echo "== $1 -> HTTP $code"
            grep -o '<meta property="og:\(title\|description\|url\|image\)" content="[^"]*"' /tmp/page.html || true
            title=$(grep -o '<meta property="og:title" content="[^"]*"' /tmp/page.html | sed 's/.*content="//; s/"$//' || true)
            img=$(grep -o '<meta property="og:image" content="[^"]*"' /tmp/page.html | sed 's/.*content="//; s/"$//; s/&amp;/\&/g' || true)
            if [ "$code" != 200 ] || [ -z "$img" ] || [[ "$title" != *"$2"* ]]; then echo "::error::$1 did not answer with its own preview tags"; fail=1; return; fi
            got=$(curl -sS -o /tmp/card.png -w '%{http_code} %{content_type} %{size_download}' "$img" || echo '000 none 0'); echo "   card -> $got"
            set -- $got
            if [ "$1" != 200 ] || [ "$2" != image/png ] || [ "$3" -lt 20000 ]; then echo "::error::card $img is not a PNG: $(head -c 300 /tmp/card.png)"; fail=1; fi
          }
          check '/b' '排行榜'
          check '/r?n=ABC&ms=850&k=4' 'ABC'
          check '/r?n=XYZ&ms=19870&k=0' 'XYZ'
          exit $fail
